# ============================================================
# Production Configuration
# ============================================================

spring.application.name=doctor-appointment
server.port=${PORT:10000}

# ============================================================
# Database (Use environment variables)
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate will automatically detect the dialect

# ============================================================
# JPA / Hibernate (Production Settings)
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# CORS Configuration (Use environment variables)
# ============================================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# JWT Configuration (Use environment variables)
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ============================================================
# Logging (Production - Increased for Debugging)
# ============================================================
logging.level.com.doctor=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=INFO

# ============================================================
# Disable H2 Console in Production
# ============================================================
spring.h2.console.enabled=false
