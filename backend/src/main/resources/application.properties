# ============================================================
# Doctor Appointment System - Application Configuration
# ============================================================

spring.application.name=doctor-appointment
server.port=8080

# ============================================================
# H2 In-Memory Database (Development - Zero Config)
# ============================================================
spring.datasource.url=jdbc:h2:mem:doctordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# MySQL Database (Production - Uncomment to use MySQL)
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/doctor_appointment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password_here
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT Configuration
# ============================================================
# IMPORTANT: Change this secret in production! Must be >= 256 bits (32 chars)
jwt.secret=DoctorAppointmentSystemSuperSecretKey2024ForJWTTokenGeneration
jwt.expiration=86400000

# ============================================================
# Logging
# ============================================================
logging.level.com.doctor=DEBUG
logging.level.org.springframework.security=INFO
